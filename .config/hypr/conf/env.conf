#################
### AUTOSTART ###
#################


# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

#重要的自启动
exec-once = mako
exec-once = waybar
exec-once = fcitx5 --replace -d
exec-once = hypridle
exec-once = udiskie

exec-once = sleep 1 && copyq   #sleep 延迟保证正常作用到waybar
exec-once = sleep 1 && nm-applet
exec-once = awww-daemon   #壁纸后端
exec-once = systemctl --user start hyprpolkitagent #密码提权
exec-once = swayosd-server >> ~/.cache/swayosd.log 2>&1 & #显示音量亮度条等等

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = kwalletd6 &
exec-once = /usr/lib/pam_kwallet_init &
exec-once = xrdb -merge ~/.Xresources
#不重要的自启动
exec-once = activate-linux -t '激活Arch Linux' -m '转到archlinux.org/donate以激活Arch' #玩具

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XDG_MENU_PREFIX,arch-
env = LANG,zh_CN.UTF-8
env = LC_MESSAGES,zh_CN.UTF-8
env = LC_CTYPE,zh_CN.UTF-8
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1   # 可选，统一窗口装饰

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,16
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,16
